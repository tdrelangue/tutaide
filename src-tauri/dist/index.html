<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tutellia</title>
  <style>
    :root { --bg: #0f172a; --card: #1e293b; --text: #e2e8f0; --muted: #94a3b8; --accent: #6366f1; --danger: #f87171; --border: #334155; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg); color: var(--text); font-family: Inter, system-ui, -apple-system, sans-serif; padding: 16px; }
    main { width: 100%; max-width: 440px; text-align: center; }
    h1 { font-size: 20px; margin-bottom: 8px; }
    p { color: var(--muted); font-size: 14px; line-height: 1.5; }
    .spinner { width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.1); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; text-align: left; }
    fieldset { border: 0; margin: 16px 0; display: grid; gap: 10px; }
    legend { font-weight: 600; margin-bottom: 8px; }
    label.choice { display: flex; gap: 10px; align-items: flex-start; padding: 12px; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; }
    label.choice:has(input:checked) { border-color: var(--accent); }
    label.choice span { display: block; }
    label.choice small { color: var(--muted); }
    .field { display: grid; gap: 6px; margin-top: 4px; }
    input[type="url"], input[type="text"] { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 14px; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
    button { font: inherit; font-size: 14px; padding: 10px 16px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--text); cursor: pointer; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    button:focus-visible, input:focus-visible { outline: 2px solid #a5b4fc; outline-offset: 2px; }
    .error { color: var(--danger); font-size: 14px; margin-top: 8px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <!-- Start-up (both modes) -->
    <section id="starting" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      <p id="starting-text">Démarrage en cours…</p>
    </section>

    <!-- The organisation's server cannot be reached -->
    <section id="unreachable" class="card" hidden aria-labelledby="unreachable-title">
      <h1 id="unreachable-title">Serveur de la structure injoignable</h1>
      <p id="unreachable-text"></p>
      <div class="actions">
        <button class="primary" id="retry">Réessayer</button>
        <button id="change">Changer d'adresse</button>
        <button id="use-local">Utiliser Tutellia sur cet ordinateur</button>
      </div>
    </section>

    <!-- Choice of the connection -->
    <section id="chooser" class="card" hidden aria-labelledby="chooser-title">
      <h1 id="chooser-title">Où se trouve Tutellia ?</h1>
      <form id="chooser-form" novalidate>
        <fieldset>
          <legend class="sr">Mode de connexion</legend>
          <label class="choice">
            <input type="radio" name="mode" value="local">
            <span>Sur cet ordinateur<br><small>Comme d'habitude : Tutellia fonctionne sur ce PC.</small></span>
          </label>
          <label class="choice">
            <input type="radio" name="mode" value="server">
            <span>Serveur de ma structure<br><small>Votre structure héberge Tutellia sur son propre serveur.</small></span>
          </label>
        </fieldset>
        <div class="field" id="url-field">
          <label for="server-url">Adresse du serveur (fournie par votre structure)</label>
          <input id="server-url" type="url" inputmode="url" placeholder="https://tutellia.ma-structure.fr" autocomplete="url">
        </div>
        <p class="error" id="chooser-error" role="alert"></p>
        <div class="actions">
          <button class="primary" type="submit">Enregistrer et redémarrer</button>
          <button type="button" id="chooser-cancel">Annuler</button>
        </div>
      </form>
    </section>
  </main>

  <script>
    (function () {
      var tauri = window.__TAURI__;
      var invoke = tauri && tauri.core ? tauri.core.invoke : null;
      var $ = function (id) { return document.getElementById(id); };
      var connection = { mode: "local", url: null };

      function show(id) {
        ["starting", "unreachable", "chooser"].forEach(function (s) { $(s).hidden = s !== id; });
      }

      // The app opens the local server as soon as it answers. As a fallback,
      // this page waits for the server's health check (never a blind redirect
      // to an address that is not answering yet: slow first starts happen).
      function goLocal() {
        $("starting-text").textContent = "Démarrage en cours…";
        show("starting");
        var tries = 0;
        (function poll() {
          tries += 1;
          fetch("http://localhost:3456/api/health", { cache: "no-store" })
            .then(function (r) { if (r.ok) window.location.replace("http://localhost:3456/"); else throw new Error(); })
            .catch(function () {
              if (tries < 120) setTimeout(poll, 1000);
              else $("starting-text").textContent = "Tutellia met du temps à démarrer. Fermez puis rouvrez l'application ; si cela continue, contactez le support OrigAI.";
            });
        })();
      }

      function checkServer() {
        show("starting");
        $("starting-text").textContent = "Connexion à " + connection.url + "…";
        var controller = new AbortController();
        var timer = setTimeout(function () { controller.abort(); }, 10000);
        fetch(connection.url + "/api/health", { signal: controller.signal, cache: "no-store" })
          .then(function (response) { return response.json().then(function (body) { return { ok: response.ok, body: body }; }); })
          .then(function (result) {
            clearTimeout(timer);
            if (result.ok && result.body && result.body.status === "ok" && result.body.mode === "server") {
              window.location.replace(connection.url + "/");
            } else {
              unreachable("Le serveur répond, mais Tutellia n'y est pas disponible pour le moment (base de données ou mise à jour en cours). Réessayez dans quelques minutes.");
            }
          })
          .catch(function () {
            clearTimeout(timer);
            unreachable("Impossible de joindre " + connection.url + ". Vérifiez que cet ordinateur est connecté au réseau de la structure. Si le problème continue, prévenez l'administrateur de votre structure.");
          });
      }

      function unreachable(text) {
        $("unreachable-text").textContent = text;
        show("unreachable");
        $("retry").focus();
      }

      function openChooser(message) {
        var radios = document.querySelectorAll('input[name="mode"]');
        radios.forEach(function (r) { r.checked = r.value === (connection.mode === "server" ? "server" : "local"); });
        $("server-url").value = connection.url || "";
        $("chooser-error").textContent = message || "";
        // Nothing to go back to when the saved setting was unreadable.
        $("chooser-cancel").hidden = connection.mode === "invalid";
        syncUrlField();
        show("chooser");
        document.querySelector('input[name="mode"]:checked').focus();
      }

      function syncUrlField() {
        var selected = document.querySelector('input[name="mode"]:checked');
        $("url-field").hidden = !selected || selected.value !== "server";
      }

      function save(mode, url) {
        $("chooser-error").textContent = "";
        invoke("set_connection", { mode: mode, url: url || null }).catch(function (error) {
          $("chooser-error").textContent = String(error);
          show("chooser");
        });
      }

      document.querySelectorAll('input[name="mode"]').forEach(function (r) { r.addEventListener("change", syncUrlField); });
      $("chooser-form").addEventListener("submit", function (event) {
        event.preventDefault();
        var mode = document.querySelector('input[name="mode"]:checked').value;
        save(mode, mode === "server" ? $("server-url").value : null);
      });
      $("chooser-cancel").addEventListener("click", function () {
        // Local mode: the local server is already running, go straight back to it.
        if (connection.mode === "server") checkServer(); else window.location.replace("http://localhost:3456/");
      });
      $("retry").addEventListener("click", checkServer);
      $("change").addEventListener("click", function () { openChooser(); });
      $("use-local").addEventListener("click", function () { save("local", null); });

      if (!invoke) { goLocal(); return; }
      invoke("get_connection").then(function (info) {
        connection = { mode: info.mode, url: info.url };
        if (connection.mode === "invalid") openChooser("Le réglage de connexion de cet ordinateur est illisible. Choisissez de nouveau où se trouve Tutellia.");
        else if (new URLSearchParams(window.location.search).get("choose") === "1") openChooser();
        else if (connection.mode === "server") checkServer();
        else goLocal();
      }).catch(goLocal);
    })();
  </script>
  <style>.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }</style>
</body>
</html>
